<mat-card class="example-card" appearance="outlined">

  <mat-card-header>

    <div mat-card-avatar class="example-header-image"></div>

    <mat-card-title>Nb Members</mat-card-title>

    <mat-card-subtitle>{{ Nb_Members }}</mat-card-subtitle>

  </mat-card-header>

</mat-card>
<div class="chart-wrapper">
  <canvas baseChart
          [type]="'line'"
    [datasets]="chartData"
    [labels]="chartLabels"
    [options]="chartOptions"
    >
  </canvas>
</div>
